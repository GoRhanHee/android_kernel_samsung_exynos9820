name: Kernel All Build

on:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false 
      matrix:
        model:
          - G970F
          - G970N
          - G973F
          - G973N
          - G975F
          - G975N
          - G977B
          - G977N
          - N970F
          - N971N
          - N975F
          - N976B
          - N976N    

    runs-on: ubuntu-latest 

    steps:
    - name: Import kernel source
      uses: actions/checkout@v4     
      
    - name: Install package
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential git libssl-dev bc flex bison \
          libncurses5-dev libncurses-dev cpio zip unzip \
          python3 curl rsync kmod libelf-dev \
          lz4 tar openssl python3-pip \
          gcc clang
        wget http://security.ubuntu.com/ubuntu/pool/universe/n/ncurses/libtinfo5_6.3-2ubuntu0.1_amd64.deb && sudo dpkg -i libtinfo5_6.3-2ubuntu0.1_amd64.deb   

    - name: Setting permission
      run: chmod +x build.sh

    - name: Kernel build
      run: |
        echo "Starting build for ${{ github.event.inputs.MODEL }}_Kernel File"
    
        ./build.sh "${{ github.event.inputs.MODEL }}"
        
    - name: Upload Artifacts Flashable File
      uses: actions/upload-artifact@v4
      with:
        name: ${{ github.event.inputs.MODEL }}_KernelSU-Next
        path: |
          gorhanhee/*.zip  
          gorhanhee/*.tar   

    - name: Upload Artifacts Kernel OUTPUT File
      uses: actions/upload-artifact@v4
      with:
        name: ${{ github.event.inputs.MODEL }}_Kernel_OUTPUT
        path: |
          ./out/** 
