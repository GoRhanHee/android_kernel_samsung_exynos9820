name: Samsung Exynos9820 Kernel Build

on:
  workflow_dispatch:
    inputs:
      KSU:
        description: 'Do you want to include KernelSU?'
        required: true
        type: choice
        options:
          - y
          - n
jobs:
  build:
    strategy:
      matrix:
        device: [beyond0lte, beyond0lteks, beyond1lte, beyond1lteks, beyond2lte, beyond2lteks, beyondx, beyondxks, d1, d1xks, d2s, d2x, d2xks]
    runs-on: ubuntu-latest 

    steps:
    - name: Import kernel source
      uses: actions/checkout@v4  
      
    - name: Install required package
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential bc bison flex libssl-dev make libncurses5-dev git curl clang lld \
          libelf-dev erofs-utils android-sdk-libsparse-utils build-essential automake autoconf libtool pkg-config fuse3 e2fsprogs pv liblz4-dev uuid-dev \
          libfuse3-dev fuse3 f2fs-tools fuse2fs attr zlib1g-dev rsync \
          device-tree-compiler lz4 xz-utils zlib1g-dev openjdk-17-jdk gcc g++ python3 python-is-python3 p7zip-full

    - name: Setting permission
      run: |    
        chmod +x *.sh
        chmod -R +x prebuilts/          

    - name: Cooking Kernel
      run: ./build.sh ${{ matrix.device }} ${{ github.event.inputs.KSU }}

    - name : Upload flashable file
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.device }}_Kernel_File
        path: |
          prebuilts/*.tar